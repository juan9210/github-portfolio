name: Deploy to GitHub Pages

# Publica el sitio estático (HTML/CSS/JS en la raíz) en GitHub Pages
# cada vez que se hace push a la rama principal, y permite ejecución manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos necesarios para desplegar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados; cancela los que estén en cola si llega uno nuevo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # El sitio es estático y vive en la raíz del repositorio
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
